version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # typescript 7 is not yet accepted by @typescript-eslint peer range
    # (>=4.8.4 <6.1.0); revisit once typescript-eslint ships TS7 support.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-deps:
        patterns:
          - "*"
